<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="노트북, LG노트북, lg그램, 오늘의집">
    <meta name="description" content="오늘의 집에서 lg 노트북 할인판매중">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/14941/14941149.png" type="image/x-icon">
    <title>LG노트북 16ZD90RU | 오늘의집</title>
    <!-- 올바른 제목 작성법 -->
    <!-- 메인페이지 경우 : 사이트명 예) 교보문고 -->
    <!-- 서브페이지 경우 : 페이지명-사이트명 예)돈의속성-교보문고 -->
</head>
<body>
    <div id="container">
        <!-- 1. 경로시작 -->
        <div class="path">
            <span>가전·디지털</span>
            <img src="https://cdn-icons-png.flaticon.com/128/2985/2985179.png" alt="">
            <span>컴퓨터·노트북</span>
            <img src="https://cdn-icons-png.flaticon.com/128/2985/2985179.png" alt="">
            <span>노트북</span>
            <img src="https://cdn-icons-png.flaticon.com/128/2985/2985179.png" alt="">
            <em>노트북</em>
        </div>
        <!-- 2. 상품 정보 시작 -->
        <div class="contents">
            <!-- 2-1. (좌)이미지 -->
            <div class="thumbnail">
                <div class="thum_small">
                    <!-- 판매상품에 따라 썸네일 개수가 다르므로 그룹으로 묶어야함 -->
                    <!-- href=# 이란? 연결링크가 없을때 임시링크 -->
                    <a href="#"><img src="" alt=""></a>
                </div>
                <div class="thum_big">
                    <img src="" alt="">
                </div>
            </div>
            <!-- 2-1. (우)정보 -->
            <div class="detail">
                <a href="#" class="brand">LG전자</a>
                <div class="item_id_bookmark_share">
                    <h1 class="item_id">LG노트북 16ZD90RU-GX56K<br>16GB/512GB/WIN11홈</h1>
                    <div class="bookmark_share">
                        <a href="#" class="bookmark">
                            <img src="https://cdn-icons-png.flaticon.com/128/5662/5662990.png" alt="찜하기">
                            <span class="num">41</span>
                        </a>
                        <a href="#" class="share"><img src="https://cdn-icons-png.flaticon.com/128/1358/1358023.png" alt="공유하기"></a>
                    </div>
                </div>
                <a href="#re" class="review"><!-- 바로가기링크 -->
                    <div class="score"><!-- 별 이미지가 2개 이상있으니 그룹묶기 -->
                        <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="">
                        <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="">
                        <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="">
                        <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="">
                        <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="">
                        <div class="number">8개 리뷰</div>
                    </div>
                </a>
                <div class="price_group">
                    <!-- 1행(할인전) -->
                    <div class="nonsale_price_wrap">
                        <span class="sale_percent">1%</span>
                        <del class="nonsale_price">1,700,000원</del>
                        <a href="#" class="sale_info"><img src="" alt="가격책정기준"></a>
                        <!-- 위 a태그 클릭시 나오는 판매정보 -->
                        <div class="sale_info_open">상품등록일을 기준으로...</div> 
                    </div>
                    <!-- 2행(할인후) -->
                    <div class="sale_price_delivery_time">
                        <span class="sale_price"><em>1,679,000</em>원</span>
                        <img src="" alt="오늘출발">
                    </div>
                </div><!-- e: price_group -->
                <!-- 혜택 -->
                <div class="benefit">
                    <h2>혜택</h2>
                    <div class="point_info_installment_info">
                        <p class="point_info"><em>1,679P</em>적립 (WELCOME 0.1%적립)</p>
                        <a href="#" class="installment_info">월 279,833 (6개월) 무이자할부<img src="" alt="상세정보 펼치기"></a>
                    </div>
                </div>
                <!-- 배송 -->
                <div class="delivery">
                    <h2>배송</h2>
                    <div class="delivery_info">
                        <p class="delivery_charge"><em>무료배송</em></p>
                        <p class="delivery_repart">
                            지금 주문시 내일출발
                            <a href="#"><img src="" alt="배송 상세정보 펼치기"></a>
                        </p>
                        <p class="delivery_category">일반택배</p>
                        <p class="delivery_charge_02">제주도/도서산간 지역 8,000원</p>
                    </div>
                </div>
                <!-- 브랜드 -->
                <div class="brand_info">
                    <a href="#" class="brand_title">
                        <img src="" alt="브랜드로고">
                        <span class="brand_name">
                            <span class="brand_name_icon">
                                <em>LG전자</em>
                                <img src="" alt="브랜드 바로가기">
                            </span>
                            <span>브랜드</span>
                        </span>
                    </a>
                    <a href="#"><img src="" alt="저장하기"></a>
                </div>

</html>
